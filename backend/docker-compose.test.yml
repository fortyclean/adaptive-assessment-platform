version: '3.9'

services:
  mongodb-test:
    image: mongo:7.0
    container_name: adaptive_assessment_mongodb_test
    restart: 'no'
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: test_admin
      MONGO_INITDB_ROOT_PASSWORD: test_password
      MONGO_INITDB_DATABASE: adaptive_assessment_test
    volumes:
      - mongodb_test_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis-test:
    image: redis:7.2-alpine
    container_name: adaptive_assessment_redis_test
    restart: 'no'
    ports:
      - '6380:6379'
    command: redis-server --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongodb_test_data:
    driver: local
