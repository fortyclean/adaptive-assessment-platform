name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Read application version
        id: version
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             adaptive-mastery-v${{ steps.version.outputs.value }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-mastery-v${{ steps.version.outputs.value }}
          path: adaptive-mastery-v${{ steps.version.outputs.value }}.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: adaptive-mastery-v${{ steps.version.outputs.value }}.apk
          name: "EduAssess ${{ github.ref_name }}"
          body: |
            ## EduAssess — Adaptive Assessment Platform

            ### Android package

            Download `adaptive-mastery-v${{ steps.version.outputs.value }}.apk` from this release and install it on an Android test device.

            ### Tester access

            Test accounts and environment-specific access details are not published in release notes. Share them only through the approved private tester channel.

            ### Validation reminder

            Before promoting this build, verify the matching release checklist, Android smoke tests, notification behavior, and crash-reporting privacy checks.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
