name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  secrets:
    name: Production secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tracked files contain no configured production secrets
        run: node scripts/verify-no-production-secrets.mjs

      - name: Verify release notes do not publish demo credentials
        run: node scripts/verify-release-notes-safe.mjs

  release-evidence:
    name: Release evidence preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preview release evidence gate
        run: |
          node scripts/verify-release-evidence.mjs | tee release-evidence-preview.txt
          {
            echo "## Release evidence preview"
            echo
            echo '```text'
            cat release-evidence-preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --silent

      - name: Lint
        run: npm run lint
